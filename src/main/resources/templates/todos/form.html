<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${id} != null ? 'Edit Todo' : 'New Todo'">Todo Form</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 24px; max-width: 600px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error { color: #dc3545; font-size: 0.9em; margin-top: 4px; }
        .btn { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-secondary { background-color: #6c757d; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
<h1 th:text="${id} != null ? 'Edit Todo #' + ${id} : 'New Todo'">Todo</h1>

<form th:action="${id} != null ? @{/todos/{id}(id=${id})} : @{/todos}"
      th:object="${todoRequest}"
      method="post">

    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" placeholder="Enter todo title" />
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title Error</div>
    </div>

    <div class="form-group">
        <label for="description">Description:</label>
        <textarea id="description" th:field="*{description}" rows="4" placeholder="Enter description (optional)"></textarea>
        <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description Error</div>
    </div>

    <div class="form-group">
        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" th:field="*{dueDate}" />
        <div class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">Due Date Error</div>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" th:field="*{completed}" /> Completed
        </label>
    </div>

    <div style="margin-top: 20px;">
        <button type="submit" class="btn">Save</button>
        <a th:href="@{/todos}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</body>
</html>
